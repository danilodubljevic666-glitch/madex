<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <link rel="canonical" href="https://www.stamparijamadex.com/" />

    <!-- Open Graph / Twitter -->
    <meta property="og:title" content="Štamparija MADEX Nikšić — offset i digitalna štampa" />

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="mobile-web-app-capable" content="yes" />

      </style>
